apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mini-projet
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.26-alpine
          ports:
            - name: http
              containerPort: 80
