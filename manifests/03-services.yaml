apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: mini-projet
  labels:
    app: api
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: api
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: mini-projet
  labels:
    app: frontend
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
